plugins {
    id 'com.android.application' version '9.4.1'
}

android {
    namespace 'com.android.launcher3'
    compileSdk 34

    defaultConfig {
        applicationId 'com.android.launcher3'
        minSdk 21
        // Kept below 30 on purpose: modern package-visibility filtering, scoped
        // storage, and edge-to-edge enforcement are skipped so this KitKat-era
        // launcher behaves exactly as it did on 4.4. See README.md.
        targetSdk 29
        versionCode 1
        versionName '1.0'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            // Excluded: relies on protobuf-nano classes generated by the old
            // AOSP build (see README.md).
            java.excludes += ['**/LauncherBackupHelper.java']
        }
    }

    compileOptions {
        // Java 11 language level: same bytecode behavior for this codebase,
        // but avoids the JDK 21 "source/target 8 is obsolete" warnings.
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'com.android.support:support-v4:28.0.0'
    implementation 'junit:junit:4.13.2'
}